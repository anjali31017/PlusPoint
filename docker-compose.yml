  mongodb_pluspoint:
    image: mongo:6
    container_name: mongodb_pluspoint
    restart: always
    env_file:
      - ./backend/.env
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    #   MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "27018:27017" 
    volumes:
      - mongo_data:/data/db
    networks:
      - pluspoint_network

  redis_pluspoint:
    image: redis:7-alpine
    container_name: redis_pluspoint
    ports:
      - "6379:6379"
    networks:
      - pluspoint_network

  celery_pluspoint:
    build: ./backend
    container_name: celery_pluspoint
    command: celery -A app.celery.worker worker --loglevel=info --concurrency=2
    depends_on:
      - redis_pluspoint
      - mongodb_pluspoint
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    networks:
      - pluspoint_network

  flower_pluspoint:
    image: mher/flower:2.0
    container_name: flower_pluspoint
    command: >
      celery
      --broker=redis://redis_pluspoint:6379/0
      flower
      --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis_pluspoint
      - celery_pluspoint
    networks:
      - pluspoint_network

  frontend_pluspoint:
    image: nginx:alpine
    container_name: frontend_pluspoint
    restart: always
    ports:
      - "3000:80"       # Map localhost:3000 → Nginx
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - pluspoint_network

