networks:
  pluspoint_network:
    driver: bridge
    name: pluspoint

services:

  fastapi_pluspoint:
    build: ./backend
    container_name: fastapi_pluspoint
    # depends_on:
    #   - kafka_pluspoint_1
    #   - kafka_pluspoint_2
    #   - celery_pluspoint
    #   - mongodb_pluspoint
    env_file:
      - ./backend/.env
    restart: always
    volumes:
      - ./backend/app:/app/app 
      - ./backend/images/kyc:/app/images/kyc
      - ./backend/images/profile:/app/images/profile
    ports:
      - "5000:5000"
    networks:
      - pluspoint_network

  kafka_pluspoint_1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_pluspoint_1
    ports:
      - "29092:9092"   # Host:Container
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_pluspoint_1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka_pluspoint_1:9093"
      KAFKA_CLUSTER_ID: "VzJk8iGjR9ePrwxmXKZauw"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: nc -z kafka_pluspoint_1 9092 || exit 1
      interval: 5s
      retries: 10
      timeout: 3s
    networks:
      - pluspoint_network

