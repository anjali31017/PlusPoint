networks:
  pluspoint_network:
    driver: bridge
    name: pluspoint

services:
  kafka_pluspoint_1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_pluspoint_1
    ports:
      - "29091:9092"   # Host:Container; for outside-Docker access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_pluspoint_1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka_pluspoint_1:9093,2@kafka_pluspoint_2:9095"
      KAFKA_CLUSTER_ID: "<your-cluster-id>"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: nc -z kafka_pluspoint_1 9092 || exit 1
      interval: 5s
      retries: 10
    networks:
      - pluspoint_network

  kafka_pluspoint_2:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_pluspoint_2
    ports:
      - "29094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_pluspoint_2:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka_pluspoint_1:9093,2@kafka_pluspoint_2:9095"
      KAFKA_CLUSTER_ID: "<your-cluster-id>"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: nc -z kafka_pluspoint_2 9094 || exit 1
      interval: 5s
      retries: 10
    networks:
      - pluspoint_network

  fastapi_pluspoint:
    build: .
    container_name: fastapi_pluspoint
    depends_on:
      - kafka_pluspoint_1
      - kafka_pluspoint_2
    env_file:
      - .env
    restart: always
    volumes:
      - ./app:/app/app 
    ports:
      - "5000:5000"
    networks:
      - pluspoint_network

  mongodb_pluspoint:
    image: mongo:6
    container_name: mongodb_pluspoint
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "27018:27017" 
    volumes:
      - mongo_data:/data/db
    networks:
      - pluspoint_network

  # kafka-ui:
  #   image: provectuslabs/kafka-ui
  #   container_name: kafka-ui
  #   ports:
  #     - "8090:8080"
  #   restart: always
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka_pluspoint_1:9092,kafka_pluspoint_2:9094
  #   networks:
  #     - pluspoint_network

volumes:
  mongo_data:
  data: