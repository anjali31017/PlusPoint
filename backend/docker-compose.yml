version: "3.9"

services:
  fastapi_pluspoint:
    build: .
    container_name: fastapi_pluspoint
    ports:
      - "5000:5500"  # host:container
    depends_on:
      - mongodb_pluspoint
    env_file:
      - .env
    restart: always

  mongodb_pluspoint:
    image: mongo:6
    container_name: mongodb_pluspoint
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27018:27017"  # host:container
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
   