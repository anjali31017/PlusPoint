version: "3.9"

services:
  fastapi_pluspoint:
    build: .
    container_name: fastapi_pluspoint
    ports:
      - "5000:5500"  # host:container
    depends_on:
      - mysql_pluspoint
    env_file:
      - .env
    restart: always

  mysql_pluspoint:
    image: mysql:8
    container_name: mysql_pluspoint
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    ports:
      - "3308:3306"  # host:container (avoids conflict with host MySQL)
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
