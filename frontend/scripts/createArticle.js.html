  <script src="../scripts/auth.js"></script>

  <script>
    $(document).ready(function () {
      lucide.createIcons();

      // Extract firm_id from URL
      const urlParams = new URLSearchParams(window.location.search);
      const firm_id = urlParams.get('firm_id');

      // Initialize TinyMCE
      tinymce.init({
        selector: '#editor',
        height: 500,
        plugins: 'print preview paste importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media template codesample table charmap hr pagebreak nonbreaking anchor insertdatetime advlist lists wordcount imagetools textpattern help emoticons',
        toolbar: 'undo redo | bold italic underline strikethrough | fontselect fontsizeselect formatselect | alignleft aligncenter alignright alignjustify | outdent indent |  numlist bullist | forecolor backcolor removeformat | pagebreak | charmap emoticons | fullscreen  preview print | insertfile image media link anchor codesample | ltr rtl',
        menubar: 'file edit view insert format tools table help',
        image_title: true,
        automatic_uploads: true,
        images_upload_handler: function (blobInfo, success, failure) {
          const token = getAccessToken(); // from auth.js
          const formData = new FormData();
          formData.append('file', blobInfo.blob(), blobInfo.filename());

          $.ajax({
            url: 'http://127.0.0.1:5000/api/media/upload',
            type: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            data: formData,
            processData: false,
            contentType: false,
            success: function (res) {
              if (res.status === 1 && res.data.location) {
                success(res.data.location); // URL inserted into TinyMCE
              } else {
                failure('Upload failed');
              }
            },
            error: function (err) {
              failure('Upload failed');
            }
          });
        },
      });

      // Submit Function
      async function submitArticle(status) {
        const title = $('#title').val().trim();
        const category = $('#category').val().split(',').map(c => c.trim()).filter(Boolean);
        const tags = $('#tags').val().split(',').map(t => t.trim()).filter(Boolean);
        const hot_topic = $('#hot_topic').is(':checked');
        const content = tinymce.get('editor').getContent();

        if (!title || !content) {
          Swal.fire('Error', 'Title and Content are required!', 'error');
          return;
        }

        try {
          const token = getAccessToken();
          if (!token) { redirectToLogin(); return; }

          await ajaxWithJWT({
            url: `http://127.0.0.1:5000/api/article/create?firm_id=${firm_id}`,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ title, status, content, category, tags, hot_topic }),
          });

          Swal.fire('Success', `Article ${status === 'DRAFT' ? 'saved as draft' : 'published'}!`, 'success')
            .then(() => window.location.href = 'home.html');

        } catch (err) {
          Swal.fire('Error', 'Failed to submit article', 'error');
          console.error(err);
        }
      }

      // Button events
      $('#saveDraft').click(() => submitArticle('DRAFT'));
      $('#publish').click(() => submitArticle('PUBLISHED'));
    });
  </script>
