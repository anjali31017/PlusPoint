<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification - PlusPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body class="bg-gradient-to-tr from-blue-100 to-purple-200 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 space-y-6 relative overflow-hidden">

    <!-- Hero illustration -->
    <div
      class="absolute -top-16 -right-16 w-40 h-40 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse">
    </div>

    <h1 class="text-4xl font-extrabold text-center text-purple-700 mb-2">Verify OTP</h1>
    <p class="text-center text-gray-500 mb-6">Enter the 6-digit code sent to your email</p>

    <form id="otpForm" class="space-y-5" novalidate>
      <div class="flex justify-between space-x-3">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
          class="otp-input w-12 h-14 border border-gray-300 rounded-lg text-center text-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
          class="otp-input w-12 h-14 border border-gray-300 rounded-lg text-center text-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
          class="otp-input w-12 h-14 border border-gray-300 rounded-lg text-center text-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
          class="otp-input w-12 h-14 border border-gray-300 rounded-lg text-center text-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
          class="otp-input w-12 h-14 border border-gray-300 rounded-lg text-center text-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*"
          class="otp-input w-12 h-14 border border-gray-300 rounded-lg text-center text-2xl focus:outline-none focus:ring-2 focus:ring-purple-400" />
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold py-3 rounded-lg hover:scale-105 transition-transform duration-300 shadow-lg mt-4">
        Verify OTP
      </button>
    </form>

      Didn't receive the code?
      <a href="#" id="resendOTP" class="text-purple-600 font-semibold hover:underline opacity-50 pointer-events-none">
        Resend OTP

      <span id="resendTimer" class="ml-2 text-xs text-gray-400"></span>
    </p>
    <p class="text-center text-gray-500 mt-1 text-sm">
      Time remaining: <span id="otpTimer">05:00</span>
    </p> -->
    <p class="text-center text-gray-500 mt-4 text-sm">
      Didn't receive the code?
      <button id="resendOTP" type="button"

        Resend OTP
      </button>
      <!-- <a href="#" id="resendOTP" class="text-purple-600 font-semibold hover:underline opacity-50 pointer-events-none">
        Resend OTP
      </a> -->
    </p>

    <p class="text-center text-gray-500 mt-1 text-sm">
      Time remaining: <span id="otpTimer">05:00</span>
    </p>
