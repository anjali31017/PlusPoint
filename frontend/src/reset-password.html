<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../media/pluspoint_logo.png">
  <title>Reset Password - PlusPoint</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Floating labels */
    .floating-input:focus~label,
    .floating-input:not(:placeholder-shown)~label {
      transform: translateY(-1.9rem) scale(0.85);
      color: #6B46C1;
      background-color: white;
      padding: 0 0.25rem;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
  </style>
</head>

<body class="bg-gradient-to-tr from-blue-100 to-purple-200 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 space-y-6 relative overflow-hidden">

    <!-- Background Glow -->
    <div
      class="absolute -top-16 -right-16 w-40 h-40 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse">
    </div>
    <img src="../media/pluspoint_logo.png" alt="PLUSPOINT" width="50" height="50" style="display:block; margin:auto;">
    <h1 class="text-4xl font-extrabold text-center text-purple-700 mb-2">
      Reset Password
    </h1>

    <p class="text-center text-gray-500 mb-6">
      Enter your new password below
    </p>

    <form id="resetForm" class="space-y-5" novalidate>

      <!-- New Password -->
      <div class="relative">
        <input type="password" id="password" placeholder=" "
          class="floating-input w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 transition duration-300 peer">
        <label for="password"
          class="absolute left-4 top-3 text-gray-400 pointer-events-none transition-all duration-300 bg-white px-1">
          New Password *
        </label>
        <button type="button"
          class="absolute right-3 top-3 text-gray-500 hover:text-purple-600"
          onclick="togglePassword('password', this)">
          👁️
        </button>
        <p class="error-msg hidden" id="passwordError"></p>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <input type="password" id="confirmPassword" placeholder=" "
          class="floating-input w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 transition duration-300 peer">
        <label for="confirmPassword"
          class="absolute left-4 top-3 text-gray-400 pointer-events-none transition-all duration-300 bg-white px-1">
          Confirm Password *
        </label>
        <button type="button"
          class="absolute right-3 top-3 text-gray-500 hover:text-purple-600"
          onclick="togglePassword('confirmPassword', this)">
          👁️
        </button>
        <p class="error-msg hidden" id="confirmPasswordError"></p>
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold py-3 rounded-lg hover:scale-105 transition-transform duration-300 shadow-lg">
        Reset Password
      </button>
      <p class="error-msg hidden text-center" id="formError"></p>

    </form>

    <p class="text-center text-gray-500 mt-4">
      Back to
      <a href="./login.html" class="text-purple-600 font-semibold hover:underline">
        Login
      </a>
    </p>
  </div>

  <script src="../scripts/reset-password.js"></script>
  <script src="../scripts/index.js"></script>
</body>

</html>
