<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KYC Terms & Conditions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-purple-700 mb-4">
            KYC Terms & Conditions
        </h1>

        <p class="text-gray-600 mb-3">
            By submitting KYC information, you agree that:
        </p>

        <ul class="list-disc pl-6 text-gray-600 space-y-2">
            <li>All information provided is accurate and belongs to you</li>
            <li>Your documents will be securely stored</li>
            <li>Verification status will be shared via email</li>
            <li>False information may lead to account suspension</li>
        </ul>

        <button onclick="history.back()"
            class="mt-6 px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
            Go Back
        </button>
    </div>
</body>

</html>
