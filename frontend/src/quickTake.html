<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../media/pluspoint_logo.png">
    <title>QuickTake - PlusPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript"
        src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        .content-scroll {
            scrollbar-width: thin;
            scrollbar-color: #E9D5FF transparent;
        }

        .content-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .content-scroll::-webkit-scrollbar-thumb {
            background: #E9D5FF;
            border-radius: 10px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }



        /* === REELS FEED CONTAINER === */

        #quicktake-feed {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .reel {
            position: relative;
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 2rem;
            color: #1f2933;
        }

        /* pastel gradient bg */
        .reel-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        /* main content */
        .reel-content {
            position: relative;
            z-index: 5;

            max-width: 850px;
            width: 100%;
        }

        /* ====== HEADER ===== */

        .reel-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reel-user {
            font-weight: 600;
            cursor: pointer;
        }

        .reel-user span {
            color: #6366f1;
        }

        .badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .6);
        }

        .badge.hot {
            background: #ef4444;
            color: white;
        }

        /* ===== TEXT ===== */

        .reel-title {
            font-size: 2.4rem;
            font-weight: 700;
            margin-top: 1rem;
        }

        .reel-summary {
            font-size: 1.1rem;
            margin-top: 1rem;
            line-height: 1.7;
        }

        /* ===== ACTION BAR ===== */

        .reel-actions {
            position: absolute;
            left: 24px;
            bottom: 90px;

            z-index: 10;

            display: flex;
            flex-direction: column;
            gap: 16px;

            background: rgba(255, 255, 255, .55);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 18px;
            width: 170px;
        }

        .action-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-weight: 500;
            cursor: pointer;
        }

        .action-btn button {
            background: none;
            border: none;
            font-size: 16px;
        }

        /* ===== VIEW FULL BTN ===== */

        .view-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            background: black;
            color: white;
            padding: 12px 30px;
            border-radius: 999px;
        }

        /* ===== MOBILE ===== */

        @media(max-width:768px) {

            .reel-title {
                font-size: 1.7rem;
            }

            .reel-actions {
                left: 12px;
                bottom: 80px;
                width: 150px;
            }

        }






        #google_translate_element .goog-te-gadget a[href*="translate.google.com"] {
            display: none !important;
        }

        .goog-logo-link {
            display: none !important;
        }

        .goog-te-gadget {
            font-size: 0px !important;
        }
    </style>
</head>

    <main class="flex-1 h-screen overflow-y-auto bg-white content-scroll">

            <div class="flex items-center space-x-2 md:space-x-5">

        </header>

        <div id="content-wrapper" class="p-6 md:p-10 max-w-6xl mx-auto pb-32 md:pb-10">

    <div id="notification-toast-container" class="fixed bottom-4 left-4 z-50 flex flex-col gap-2"></div>
