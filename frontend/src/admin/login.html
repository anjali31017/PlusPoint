<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - PlusPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Floating labels */
    .floating-input:focus~label,
    .floating-input:not(:placeholder-shown)~label {
      transform: translateY(-1.8rem) scale(0.85);
      color: #ec4899;
      background-color: white;
      padding: 0 0.25rem;
    }

    /* Button hover gradient */
    .btn-gradient:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body class="bg-gradient-to-tr from-blue-200 via-white to-pink-200 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 space-y-6 relative overflow-hidden">
    <h1 class="text-4xl font-extrabold text-center text-black mb-2">Welcome Back</h1>
    <p class="text-center text-gray-600 mb-6">Log in to your admin dashboard</p>

    <form id="loginForm" class="space-y-5" novalidate>

      <!-- Email -->
      <div class="relative">
        <input type="email" id="email" name="email" required placeholder=" "
          class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-300 peer">
        <label for="email"
          class="absolute left-4 top-3 text-gray-400 pointer-events-none transition-all duration-300 bg-white px-1">Email
          *</label>
        <p class="text-red-500 text-sm mt-1 hidden" id="emailError">Please enter a valid email</p>
      </div>

      <!-- Password -->
      <div class="relative">
        <input type="password" id="password" name="password" required placeholder=" "
          class="floating-input w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400 transition duration-300 peer">
        <label for="password"
          class="absolute left-4 top-3 text-gray-400 pointer-events-none transition-all duration-300 bg-white px-1">Password
          *</label>

        <!-- Eye toggle -->
        <button type="button" class="absolute right-3 top-3 text-gray-500 hover:text-pink-600"
          onclick="togglePassword('password', this)">👁️</button>

        <p class="text-red-500 text-sm mt-1 hidden" id="passwordError">Password is required</p>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-gradient-to-r from-blue-400 to-pink-400 text-white font-bold py-3 rounded-lg shadow-lg btn-gradient transition-transform duration-300">
        Login
      </button>

    </form>
  </div>

  <script>


    // Validate email format
    function isValidEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // Check session on page load
    $(document).ready(function () {

      // $.ajax({
      //   url: "http://127.0.0.1:5000/api/admin/check-session",
      //   method: "GET",
      //   xhrFields: { withCredentials: true }, // include cookies
      //   success: function (res) {
      //     if (res.status === 1) {
      //       window.location.href = "kyc.html";
      //     }
      //   },
      //   error: function (xhr) {
      //     // Session not active or expired, stay on login
      //   }
      // });

      // Handle login form submission
      $("#loginForm").submit(function (e) {
        e.preventDefault();

        const email = $("#email").val().trim();
        const password = $("#password").val().trim();
        let valid = true;

        // Reset errors
        $("#emailError").addClass("hidden");
        $("#passwordError").addClass("hidden");

        // Validate email
        if (!email || !isValidEmail(email)) {
          $("#emailError").removeClass("hidden");
          valid = false;
        }

        // Validate password
        // Validate password
        if (!password) {
          $("#passwordError").text("Password is required").removeClass("hidden");
          valid = false;
        } else if (password.length < 6) {
          $("#passwordError").text("Password must be at least 6 characters").removeClass("hidden");
          valid = false;
        }


        if (!valid) return;

        // AJAX login
        $.ajax({
          url: "http://127.0.0.1:5000/api/admin/login",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({ email: email, password: password }),
          xhrFields: { withCredentials: true },
          success: function (res) {
            Swal.fire({
              icon: "success",
              title: "Login successful!",
              showConfirmButton: false,
              timer: 1000
            }).then(() => {
              setTimeout(() => {
                window.location.href = "/src/admin/kyc.html";
              }, 100); // 100ms delay ensures cookie is saved
            });
          },
          error: function (xhr) {
            let message = "No response from server";

            try {
              const err = JSON.parse(xhr.responseText);
              message = err.detail || err.message || message;
            } catch (e) {
              // fallback to status text
              message = xhr.statusText || message;
            }

            Swal.fire({
              icon: "error",
              title: "Login failed",
              text: message
            });
          }

        });
      });
    });
  </script>

  <script src="../../scripts/index.js"></script>
</body>

</html>
