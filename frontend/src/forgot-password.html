<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - PlusPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Floating labels */
    .floating-input:focus ~ label,
    .floating-input:not(:placeholder-shown) ~ label {
      transform: translateY(-1.9rem) scale(0.85); /* move above input border */
      color: #6B46C1; /* deep purple */
      background-color: white; /* prevent overlapping border */
      padding: 0 0.25rem; /* small padding on sides */
    }
  </style>
</head>
<body class="bg-gradient-to-tr from-blue-100 to-purple-200 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 space-y-6 relative overflow-hidden">

    <!-- Hero illustration -->
    <div class="absolute -top-16 -right-16 w-40 h-40 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>

    <h1 class="text-4xl font-extrabold text-center text-purple-700 mb-2">Forgot Password</h1>
    <p class="text-center text-gray-500 mb-6">Enter your email to reset your password</p>

    <form id="forgotForm" class="space-y-5" novalidate>

      <!-- Email -->
      <div class="relative">
        <input type="email" id="email" name="email" required placeholder=" " 
          class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 transition duration-300 peer">
        <label for="email" class="absolute left-4 top-3 text-gray-400 pointer-events-none transition-all duration-300 bg-white px-1">Email *</label>
        <p class="text-red-500 text-sm mt-1 hidden" id="emailError">Please enter a valid email</p>
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold py-3 rounded-lg hover:scale-105 transition-transform duration-300 shadow-lg">
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-gray-500 mt-4">Remember your password? <a href="#" class="text-purple-600 font-semibold hover:underline">Login</a></p>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const email = document.getElementById('email');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

      if (!email.value.match(emailPattern)) {
        document.getElementById('emailError').classList.remove('hidden');
      } else {
        document.getElementById('emailError').classList.add('hidden');
        alert('Password reset link sent! 📧');
        form.reset();
      }
    });
  </script>

</body>
</html>
