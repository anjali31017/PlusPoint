<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../media/pluspoint_logo.png">
  <title>Article - PlusPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    /* ---- Article Content Safety ---- */
    .article-content {
      max-width: 100%;
      overflow-x: hidden;
      word-wrap: break-word;
    }

    /* Force wrap on everything inside */
    .article-content * {
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    /* Images */
    .article-content img {
      max-width: 50%;
      height: auto;
      display: block;
      margin: 1.5rem auto;
      border-radius: 12px;
    }

    /* Code blocks (BIG culprit) */
    .article-content pre {
      white-space: pre-wrap;
      /* wrap lines */
      word-break: break-word;
      overflow-x: auto;
      /* allow scroll if needed */
      max-width: 100%;
      padding: 1rem;
      border-radius: 8px;
      background: #0f172a;
      /* slate-900 */
      color: #e5e7eb;
      font-size: 0.875rem;
    }

    /* Inline code */
    .article-content code {
      word-break: break-word;
    }

    /* Blockquotes */
    .article-content blockquote {
      border-left: 4px solid #9333ea;
      /* purple */
      padding-left: 1rem;
      color: #374151;
      background: #faf5ff;
      border-radius: 6px;
      margin: 1.5rem 0;
    }

    #google_translate_element .goog-te-gadget a[href*="translate.google.com"] {
      display: none !important;
    }

    .goog-logo-link {
      display: none !important;
    }

    .goog-te-gadget {
      font-size: 0px !important;
    }
  </style>
</head>

<body class="bg-white min-h-screen flex flex-col md:flex-row overflow-hidden font-sans text-gray-900">

  <aside
    class="hidden md:flex flex-col w-50 bg-gradient-to-tr from-blue-100 to-purple-200 h-screen sticky top-0 border-r border-gray-100 z-20">
    <div class="p-5 flex flex-col items-center">
      <h1
        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-700 to-blue-600 tracking-tighter">
        PlusPoint</h1>
    </div>
    <nav class="flex-1 overflow-y-auto px-6 py-4 space-y-2 no-scrollbar">
      <div class="space-y-1 mb-8">
        <a href="home.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="home" class="w-5 h-5"></i><span>HOME</span>
        </a>
        <a href="search.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="search" class="w-5 h-5"></i><span>SEARCH</span>
        </a>
        <a href="quickTake.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="compass" class="w-5 h-5"></i><span>QUICK TAKE</span>
        </a>
        <a href="coverage.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="newspaper" class="w-5 h-5"></i><span>COVERAGE</span>
        </a>
        <a href="trending.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="trending-up" class="w-5 h-5"></i><span>TRENDING</span>
        </a>
        <a href="notification.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="rss" class="w-5 h-5"></i><span>NOTIFICATION</span>
        </a>
      </div>
      <div class="pt-6 border-t border-purple-300/30 space-y-1">
        <p class="text-[10px] font-bold text-gray-500 ml-4 mb-2 tracking-[0.2em]">PERSONAL</p>
        <a href="favorites.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="heart" class="w-5 h-5"></i>
          <span>FAVORITES</span>
        </a>
        <a href="profile.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="user" class="w-5 h-5"></i><span>PROFILE</span>
        </a>
        <a href="settings.html"
          class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-gray-600 hover:bg-white hover:text-purple-700 transition-all">
          <i data-lucide="settings" class="w-5 h-5"></i><span>SETTINGS</span>
        </a>
      </div>
    </nav>
  </aside>

  <main class="flex-1 h-screen overflow-y-auto bg-white content-scroll">
    <header
      class="flex justify-between items-center p-6 bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-purple-100">


      <h2 class="flex items-center gap-3 text-2xl font-bold text-gray-800">
        <img src="../media/pluspoint_logo.png" alt="PLUSPOINT" class="w-8 h-8">
        ARTICLE
      </h2>


      <div class="flex items-center space-x-2 md:space-x-5">

        <div class="px-5 py-2 bg-gray-200" id="google_translate_element"></div>



      </div>
    </header>


    <div class="max-w-6xl mx-auto py-8 px-4">

      <!-- Title -->
      <h2 id="article-title" class="text-3xl font-bold text-gray-800"></h2>

      <!-- Publisher & Info -->
      <div class="flex items-center justify-between text-gray-500">
        <div>
          By <span id="publisher-name" class="text-purple-700 font-semibold cursor-pointer"></span>
          | <span id="published-date"></span>
        </div>
        <div class="flex gap-2">
          <span id="category" class="bg-purple-100 text-purple-700 px-2 py-1 rounded-full text-xs"></span>
          <span id="tags" class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs"></span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 mt-4">
        <button id="like-btn" class="btn-action bg-gray-200 text-gray-700 flex items-center gap-1">
          <i data-lucide="heart"></i> <span>Like</span>
        </button>
        <button id="endorse-btn" class="btn-action bg-green-600 text-white flex items-center gap-1">
          <i data-lucide="thumbs-up"></i> <span>Endorse</span>
        </button>
        <button id="report-btn" class="btn-action bg-red-600 text-white flex items-center gap-1">
          <i data-lucide="alert-circle"></i> <span>Report</span>
        </button>
        <button id="copy-link-btn" class="btn-action bg-blue-600 text-white flex items-center gap-1">
          <i data-lucide="copy"></i> <span>Copy Link</span>
        </button>
      </div>

      <!-- Article Content -->
      <div id="article-content" class="article-content prose max-w-none"></div>





  </main>



  </div>

  <div id="notification-toast-container" class="fixed bottom-4 left-4 z-50 flex flex-col gap-2"></div>



  <script>
    $(document).ready(function () {
      $('body').fadeIn(300);
      lucide.createIcons();
    });
  </script>

  <script src="../scripts/auth.js"></script>
  <script src="../scripts/endorsement.js"></script>
  <script src="../scripts/like.js"></script>
  <script src="../scripts/report.js"></script>
  <script src="../scripts/article-detail.js"></script>
  <script src="../scripts/delete-request.js"></script>
  <script src="../scripts/index.js"></script>
  <script src="../scripts/global-notifications.js"></script>
</body>

</html>
