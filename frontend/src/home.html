<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - PlusPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .content-scroll {
      scrollbar-width: thin;
      scrollbar-color: #E9D5FF transparent;
    }

    .content-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .content-scroll::-webkit-scrollbar-thumb {
      background: #E9D5FF;
      border-radius: 10px;
    }

    /* Hide scrollbar for sidebar but allow scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      display: none;
    }
  </style>
</head>

<body class="bg-white min-h-screen flex flex-col md:flex-row overflow-hidden font-sans text-gray-900">

  <aside
    class="hidden md:flex flex-col w-72 bg-gradient-to-tr from-blue-100 to-purple-200 h-screen sticky top-0 border-r border-gray-100 z-20">

    <div class="p-5 flex flex-col items-center">
      <!-- <div class="w-16 h-16 bg-white rounded-3xl flex items-center justify-center shadow-lg mb-3">
                <i data-lucide="plus" class="text-purple-600 w-10 h-10"></i>
            </div> -->
      <h1
        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-700 to-blue-600 tracking-tighter">
        PlusPoint
      </h1>
    </div>

    <nav class="flex-1 overflow-y-auto px-6 py-4 space-y-2 no-scrollbar">

      <div class="space-y-1 mb-8">
        <a href="#" data-page="home"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group bg-purple-50 text-purple-700 font-bold shadow-sm">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span>HOME</span>
        </a>
        <a href="#" data-page="search"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="search" class="w-5 h-5"></i>
          <span>SEARCH</span>
        </a>
        <a href="#" data-page="discover"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="compass" class="w-5 h-5"></i>
          <span>DISCOVER</span>
        </a>
        <a href="#" data-page="trending"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="trending-up" class="w-5 h-5"></i>
          <span>TRENDING</span>
        </a>
        <a href="#" data-page="newswire"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="rss" class="w-5 h-5"></i>
          <span>NEWSWIRE</span>
        </a>
      </div>

      <div class="pt-6 border-t border-purple-300/30 space-y-1">
        <p class="text-[10px] font-bold text-gray-500 ml-4 mb-2 tracking-[0.2em]">PERSONAL</p>

        <a href="#" data-page="notifications"
          class="nav-link flex items-center justify-between px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <div class="flex items-center space-x-4">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span>NOTIFICATIONS</span>
          </div>
          <span class="flex h-2 w-2 rounded-full bg-red-500 ring-4 ring-purple-100"></span>
        </a>

        <a href="#" data-page="favorites"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="heart" class="w-5 h-5"></i>
          <span>FAVORITES</span>
        </a>

        <a href="#" data-page="profile"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span>PROFILE</span>
        </a>

        <a href="#" data-page="settings"
          class="nav-link flex items-center space-x-4 px-4 py-3 rounded-2xl transition-all duration-300 group text-gray-600 hover:bg-white hover:text-purple-700">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span>SETTINGS</span>
        </a>
      </div>
    </nav>
  </aside>

  <main class="flex-1 h-screen overflow-y-auto bg-white content-scroll">

    <header
      class="flex justify-between items-center p-6 bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-purple-100">
      <h2 id="current-title" class="text-2xl font-bold text-gray-800">Home Feed</h2>

      <div class="flex items-center space-x-2 md:space-x-5">
        <div class="relative group">
          <button
            class="p-2.5 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-2xl transition-all duration-300">
            <i data-lucide="bell" class="w-6 h-6"></i>
            <span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
          </button>

          <div
            class="absolute top-full mt-2 right-0 bg-gray-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity">
            Notifications
          </div>
        </div>
        <div class="flex items-center pl-4 border-l border-purple-100">
    <button id="header-profile-btn" 
            class="p-2 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-2xl transition-all duration-300">
        <i data-lucide="user" class="w-7 h-7"></i>
    </button>
</div>
        <!-- <div class="flex items-center pl-2 border-l border-gray-100">
          <img src="https://i.pravatar.cc/150?img=32"
            class="w-10 h-10 rounded-2xl object-cover ring-2 ring-purple-100 hover:ring-purple-400 transition-all cursor-pointer shadow-sm">
        </div> -->
      </div>
    </header>

    <div id="content-wrapper" class="p-6 md:p-10 max-w-6xl mx-auto pb-32 md:pb-10">
      <div id="main-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div
          class="group bg-white rounded-[2.5rem] p-4 border border-gray-100 hover:border-purple-200 hover:shadow-2xl transition-all duration-500">
          <div class="h-52 bg-purple-50 rounded-[2rem] mb-4 overflow-hidden relative">
            <img src="https://picsum.photos/400/400?random=1"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
            <div
              class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold text-purple-700 shadow-sm">
              NEWSWIRE</div>
          </div>
          <div class="px-2">
            <h4 class="text-lg font-bold text-gray-800 leading-snug group-hover:text-purple-700 transition-colors">
              Welcome to PlusPoint</h4>
            <p class="text-sm text-gray-500 mt-2">The latest in decentralized news and global updates.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav
    class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-purple-100 flex justify-around items-center px-2 py-3 z-50">
    <a href="#" data-page="home" class="mobile-nav-link flex flex-col items-center text-purple-700">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="text-[10px] font-bold mt-1">HOME</span>
    </a>
    <a href="#" data-page="search" class="mobile-nav-link flex flex-col items-center text-gray-400">
      <i data-lucide="search" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium mt-1">SEARCH</span>
    </a>
    <a href="#" data-page="discover" class="mobile-nav-link flex flex-col items-center text-gray-400">
      <i data-lucide="compass" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium mt-1">DISCOVER</span>
    </a>
    <a href="#" data-page="trending" class="mobile-nav-link flex flex-col items-center text-gray-400">
      <i data-lucide="trending-up" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium mt-1">TRENDING</span>
    </a>
    <a href="#" data-page="newswire" class="mobile-nav-link flex flex-col items-center text-gray-400">
      <i data-lucide="rss" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium mt-1">NEWSWIRE</span>
    </a>
  </nav>

  <script src="../scripts/home.js"></script>
  <script src="../scripts/profile.js"></script>
</body>

</html>
